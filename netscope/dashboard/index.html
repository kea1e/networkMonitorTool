<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetScope</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // Apply saved theme before first paint to prevent flash
        (function() {
            var t = localStorage.getItem("netscope-theme");
            if (t === "light") document.documentElement.setAttribute("data-theme", "light");
        })();
    </script>
</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">Net<span>Scope</span></div>
            <span id="status-badge" class="status-badge offline">
                <span class="status-dot"></span> Connecting
            </span>
        </div>
        <div class="header-right">
            <span class="packet-count">
                Packets: <strong id="packet-count">&mdash;</strong>
            </span>
            <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
                <span class="theme-toggle-track"></span>
                <span class="theme-toggle-thumb">
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M21.75 15.5a9.75 9.75 0 0 1-13.25-13.25A10 10 0 1 0 21.75 15.5z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </span>
            </button>
        </div>
    </header>

    <!-- Stats Overview -->
    <section class="stats-bar">
        <div class="stat-card">
            <div class="stat-label">Total Devices</div>
            <div class="stat-value" id="stat-total-devices">0</div>
            <div class="stat-sub">All time discovered</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Online Now</div>
            <div class="stat-value" id="stat-online-devices">0</div>
            <div class="stat-sub">Currently active</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Data Sent</div>
            <div class="stat-value" id="stat-total-sent">0 B</div>
            <div class="stat-sub" id="stat-top-device">&mdash;</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Data Received</div>
            <div class="stat-value" id="stat-total-recv">0 B</div>
            <div class="stat-sub">Total inbound</div>
        </div>
    </section>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Device List -->
        <section>
            <div class="toolbar">
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="Search by hostname, IP, MAC, or vendor..."
                >
                <button id="filter-online-btn" class="filter-btn">Online Only</button>
            </div>
            <div id="device-list" class="device-list">
                <div class="empty-state">
                    <h3>Waiting for devices</h3>
                    <p>NetScope is listening for network traffic...</p>
                </div>
            </div>
        </section>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="chart-panel">
                <div class="chart-title">Network Throughput</div>
                <div class="chart-container">
                    <canvas id="bandwidth-chart"></canvas>
                </div>
            </div>

            <div class="top-devices-panel">
                <div class="chart-title">Top Devices by Traffic</div>
                <div id="top-devices-list">
                    <div class="empty-state"><p>No device data yet</p></div>
                </div>
            </div>
        </aside>
    </main>

    <!-- Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
